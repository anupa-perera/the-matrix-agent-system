name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install build

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest

      - name: Build Python package
        run: python -m build

      - name: Build release bundles
        run: python scripts/build_release_assets.py

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @()
          $assets += Get-ChildItem -Path dist -File | ForEach-Object { $_.FullName }
          $assets += Get-ChildItem -Path release-assets -File | ForEach-Object { $_.FullName }
          gh release create "${{ github.ref_name }}" $assets `
            --title "The Matrix Agent System ${{ github.ref_name }}" `
            --notes-file release-assets\RELEASE_NOTES.md `
            --verify-tag
